/* carpe-kit v2.0.0 — inlined verbatim (this app ships as one file, and
   tools/artifact-copy.mjs derives the preview from it). Fonts resolve to
   app/fonts. Do not edit this block; replace it from Web_Apps/carpe-kit
   when the kit version changes. Scripture keeps its own Literata (Google
   Fonts link above, unchanged); the kit's title face is "Carpe Literata"
   and is never requested here. */
/* ══ carpe-kit v2.0.0 ═════════════════════════════════════════════════════
   The shared design system for Merrick's web apps: Carpe Tasks, NITRO,
   Netflick, Narrowkind Immersion. (v1 was nav-kit: the floating bar only.)
   Source of truth: Web_Apps/carpe-kit. COPY this file, carpe-kit.js and
   fonts/ into each app; never edit the copies. An app's own identity lives
   ONLY in its colour tokens (--gn-* and its own palette). Type, spacing,
   shape and the bar are shared. Bump the app's service-worker cache on
   every copy-in and add the font files to its precache list.

   Principles (README has the reasoning):
     1  E-ink first. Solid fills, no blur, no translucency, no motion.
     2  Hierarchy by type — size, weight, case, rules — not by colour.
     3  Four voices, one per job: Plex Sans READS (body, inputs, lists);
        Plex Sans Condensed COMMANDS (buttons, the bar, list-item names);
        Plex Mono ANNOTATES (labels, counts, dates, reps); Literata TITLES
        (page + section titles; in Narrowkind it also carries scripture,
        loaded there exactly as before).
     4  The label: Mono, 11px, uppercase, +.12em — above every section.
     5  Numbers are Mono with tabular figures, so columns never jitter.
     6  One spacing scale (4-pt), three corner sizes (0 · 8 · pill).
     7  Colour is identity, not structure: each app keeps its own palette.
     8  Offline by construction: fonts are self-hosted, never fetched.
   ═════════════════════════════════════════════════════════════════════ */

/* ── fonts: self-hosted latin subsets (OFL, see fonts/LICENSE-*) ── */
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:italic;font-weight:400;font-display:swap;src:url("fonts/ibm-plex-sans-latin-400-italic.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/ibm-plex-sans-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans Condensed";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/ibm-plex-sans-condensed-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans Condensed";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/ibm-plex-sans-condensed-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/ibm-plex-mono-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Carpe Literata";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/literata-latin-600-normal.woff2") format("woff2")}

:root {
  /* ── type: families ── */
  --ck-ui:      "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --ck-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --ck-data:    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ck-title:   "Carpe Literata", "Literata", Charter, Georgia, serif;

  /* ── type: scale (px) — label · meta · body · read · section · title ── */
  --ck-fs-label: 11px;
  --ck-fs-meta: 13px;
  --ck-fs-body: 15px;
  --ck-fs-read: 17px;
  --ck-fs-section: 20px;
  --ck-fs-title: 27px;
  --ck-lh-tight: 1.18;
  --ck-lh-body: 1.45;
  --ck-track-label: .12em;

  /* ── spacing: 4-pt scale ── */
  --ck-s-1: 4px;
  --ck-s-2: 8px;
  --ck-s-3: 12px;
  --ck-s-4: 16px;
  --ck-s-5: 24px;
  --ck-s-6: 32px;

  /* ── shape ── */
  --ck-r-0: 0;
  --ck-r-1: 8px;
  --ck-r-pill: 999px;
  --ck-rule: 1px;          /* hairline */
  --ck-rule-strong: 3px;   /* section rule */
}

/* ── opt-in helpers (apps may instead point their own selectors at tokens) ── */
.ck-label {
  font-family: var(--ck-data); font-weight: 500; font-size: var(--ck-fs-label);
  letter-spacing: var(--ck-track-label); text-transform: uppercase; line-height: 1.3;
}
.ck-title {
  font-family: var(--ck-title); font-weight: 600; font-size: var(--ck-fs-title);
  line-height: var(--ck-lh-tight); letter-spacing: -.005em;
}
.ck-section {
  font-family: var(--ck-title); font-weight: 600; font-size: var(--ck-fs-section);
  line-height: var(--ck-lh-tight);
}
.ck-num { font-family: var(--ck-data); font-variant-numeric: tabular-nums; }

/* ══ floating bottom bar (was nav-kit v1.0.0) ══════════════════════════
   Pattern extracted from tasks-pwa 4.0.3: measured height (carpe-kit.js →
   --gn-h), !important keyboard hide, solid scrim, .gn-clear clearance.
   Apps set only its colour tokens; type and shape come from the kit. */
:root {
  /* colour — every app overrides these six */
  --gn-bg: #2C2C2C;
  --gn-fg: #F5F1E8;
  --gn-border: transparent;
  --gn-active-bg: #F5F1E8;
  --gn-active-fg: #2C2C2C;
  --gn-active-rule: transparent; /* optional 2px underline on the active item */
  --gn-scrim: transparent;       /* page colour behind the bar; set = --bg */

  /* shape */
  --gn-radius: 999px;            /* pill; item radius derives from it */
  --gn-border-w: 1px;
  --gn-shadow: none;             /* flat by default (Tasks: no elevation) */
  --gn-inset: 12px;              /* gap to the screen edges and bottom */
  --gn-pad: 4px;                 /* bar padding around the items */
  --gn-gap: 4px;                 /* between items */
  --gn-max: 480px;               /* bar stops growing on tablets/desktop */
  --gn-item-h: 44px;             /* minimum tap target */

  /* type */
  --gn-font: var(--ck-display);
  --gn-size: 13px;
  --gn-weight: 600;
  --gn-tracking: .08em;
  --gn-case: uppercase;

  /* layering + measured height (nav-kit.js overwrites --gn-h) */
  --gn-z: 20;
  --gn-h: 54px;
}

.gn {
  position: fixed;
  left: var(--gn-inset);
  right: var(--gn-inset);
  bottom: calc(var(--gn-inset) + env(safe-area-inset-bottom));
  z-index: var(--gn-z);
  max-width: var(--gn-max);
  margin-inline: auto;
  box-sizing: border-box;
  display: flex;
  gap: var(--gn-gap);
  padding: var(--gn-pad);
  border-radius: var(--gn-radius);
  border: var(--gn-border-w) solid var(--gn-border);
  background: var(--gn-bg);
  box-shadow: var(--gn-shadow);
}

.gn-item {
  flex: 1 1 0;
  min-width: 0;
  min-height: var(--gn-item-h);
  margin: 0;
  padding: 0 10px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 0;
  border-radius: calc(var(--gn-radius) - var(--gn-pad));
  background: transparent;
  color: var(--gn-fg);
  font: var(--gn-weight) var(--gn-size)/1.15 var(--gn-font);
  letter-spacing: var(--gn-tracking);
  text-transform: var(--gn-case);
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.gn-item svg { width: 20px; height: 20px; flex: none; }

/* active: any of the three conventions the apps already use */
.gn-item[aria-current="page"],
.gn-item[aria-current="true"],
.gn-item[aria-selected="true"],
.gn-item[aria-pressed="true"],
.gn-item.is-active {
  background: var(--gn-active-bg);
  color: var(--gn-active-fg);
  box-shadow: inset 0 -2px 0 var(--gn-active-rule);
}

/* action variant (NITRO Reroll): always filled, a little wider */
.gn-item.gn-action {
  flex-grow: 1.6;
  background: var(--gn-active-bg);
  color: var(--gn-active-fg);
}

/* thin divider between a tab group and an action */
.gn-sep {
  flex: none;
  width: var(--gn-border-w);
  margin: 8px 2px;
  background: var(--gn-fg);
  opacity: .35;
}

/* keyboard focus stays visible without colour tricks */
.gn-item:focus-visible { outline: 2px solid var(--gn-fg); outline-offset: -4px; }

/* solid backdrop from the bar's top edge down to the screen edge */
.gn-scrim {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: calc(var(--gn-h) + var(--gn-inset) * 2 + env(safe-area-inset-bottom));
  z-index: calc(var(--gn-z) - 1);
  background: var(--gn-scrim);
  pointer-events: none;
}

/* put on whichever element scrolls, so its last row clears the bar */
.gn-clear {
  padding-bottom: calc(var(--gn-h) + var(--gn-inset) * 2 + env(safe-area-inset-bottom)) !important;
}

/* keyboard up → bar and scrim step aside (nav-kit.js toggles the class).
   !important is load-bearing: apps set display inline (tasks 4.0.3). */
html.gn-kbd .gn,
html.gn-kbd .gn-scrim { display: none !important; }
html.gn-kbd .gn-clear { padding-bottom: 16px !important; }

@media print { .gn, .gn-scrim { display: none !important; } }

</style>
<style>
/* ══ E-INK FIRST ═══════════════════════════════════════════════════════
   Built for a B&W E Ink Carta panel (Bigme HiBreak Pro).
   Rules this stylesheet obeys without exception:
     · two inks only — pure black, pure paper. No greys: on Carta a mid
       grey dithers and reads as smudge, so hierarchy is carried by size,
       weight, caps and rules instead of by colour.
     · no animation, no transition, no opacity fade. Every one of those
       leaves ghosting behind on an e-ink refresh.
     · no scrolling in the reader. Pagination only.
     · one exception, decided 2026-09-23: the bottom bar floats
       (position:fixed, carpe-kit v2.0.0, shared with Merrick's other apps).
       It stays solid paper with a 1px ink keyline, never translucent, and
       .body reserves its height so text never paginates underneath it.
     · hairlines are 1px solid ink, corners are square — antialiased
       curves and shadows are exactly what a 16-level panel cannot draw.
   ═════════════════════════════════════════════════════════════════════ */
:root{
  --paper:#FFFFFF; --ink:#000000;
  --serif:'Literata',Charter,'Noto Serif',Georgia,serif;
  --sans:var(--ck-ui);   /* carpe-kit: IBM Plex Sans (was Atkinson Hyperlegible) */
  --size:19px; --lead:1.62; --pad:20px;
}
:root[data-invert="1"]{ --paper:#000000; --ink:#FFFFFF; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Android's WebView "font boosting" inflates text size in narrow columns it
   judges hard to read — short multi-line labels (the readings/done counts,
   Setup's short lines) are exactly what it targets — so a font-size set in
   CSS was not the font-size actually rendered. That's what read as "the
   margin is off, everything's truncated" across several screens at once,
   not just the one grid track. text-size-adjust:100% turns the boost off. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;
     -webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
*,*::before,*::after{transition:none!important;animation:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

/* ── frame: three rows, never scrolls ───────────────────────────────── */
/* Fallback first, dvh last: on a browser that supports dvh this must win,
   or the frame is sized against the static viewport (100vh, which includes
   the area the browser's own chrome can occupy) instead of the current
   visual viewport. Getting this backwards is why the frame could clip or
   need a scroll gesture to coax the browser's own bottom bar out of the way. */
.frame{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:11px var(--pad);border-bottom:1px solid var(--ink);
        min-height:46px;flex:none}
.topbar .t{font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .r{margin-left:auto;display:flex;gap:2px;flex:none}
.navlink{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:8px 9px;min-height:44px;
         display:flex;align-items:center}
.navlink[aria-current="true"]{background:var(--ink);color:var(--paper)}
.chip{border:1px solid var(--ink);padding:7px 11px;font-size:12px;font-weight:700;letter-spacing:.07em;
      text-transform:uppercase;min-height:40px;display:inline-flex;align-items:center}
.chip:active,.navlink:active{background:var(--ink);color:var(--paper)}

.body{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.body.nopad{overflow:hidden}
.inner{padding:var(--pad) var(--pad) 34px;max-width:720px;margin-inline:auto}

/* ── bottom bar: floating nav-kit pill. Tabs (Plan · Read · Set) on the
   browsing pages; ‹ Prev · page · Note · Next › inside the reader. Look is
   tokens only — solid paper, 1px ink keyline, inverted active item. ── */
:root{--gn-bg:var(--paper);--gn-fg:var(--ink);--gn-border:var(--ink);
      --gn-active-bg:var(--ink);--gn-active-fg:var(--paper);--gn-scrim:var(--paper);
}
.botbar .gn-item:active{background:var(--ink);color:var(--paper)}
.botbar .wide{flex-grow:1.5}
.botbar [disabled]{opacity:1;color:var(--paper);background:var(--paper);
                   text-decoration:none;visibility:hidden}

/* ── type scale ─────────────────────────────────────────────────────── */
/* The reading's kicker is a run of short phrases separated by middots; left
   to itself it breaks as "1 OF / 517" at phone width. Balance the lines. */
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-wrap:balance}
h1{font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.18;margin:5px 0 0;text-wrap:balance}
h2{font-family:var(--serif);font-weight:600;font-size:18px;margin:0;line-height:1.25}
.sub{font-size:13px;margin-top:7px}
.rule{height:1px;background:var(--ink);margin:18px 0}
.rule.thick{height:3px}

/* ── lists: big square rows, ink-bordered ───────────────────────────── */
.rows{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--ink);margin-top:16px}
/* auto minmax(0,1fr) auto — plain "1fr" does not shrink below its content's
   min-content width, so a long enough right-hand label could force the row
   wider than its container; with .body's overflow-x:hidden that clipped the
   right edge instead of wrapping. minmax(0,...) lets the middle column give
   way instead. */
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:13px;
     padding:14px 4px;border-bottom:1px solid var(--ink);min-height:56px;width:100%}
.row:active{background:var(--ink);color:var(--paper)}
.row .lead{font-family:var(--serif);font-weight:600;font-size:17px;min-width:26px}
.row .ttl{font-family:var(--serif);font-size:17px;line-height:1.25}
.row .meta{font-size:12px;margin-top:4px;letter-spacing:.02em}
.row .tail{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:right;line-height:1.5}
.flag{font-family:var(--serif);font-weight:600;font-size:15px}

/* ── toggle row: a plan reading with its own "done" checkbox ──────────
   Split from .row because a checkbox and a navigation target can't both be
   the same <button> — nested interactive elements are invalid HTML and
   behave unpredictably. tchk toggles nk:done in place (no page re-render,
   no full e-ink refresh); tgo navigates into the reading, same as a .row. */
.trow{display:flex;align-items:stretch;border-bottom:1px solid var(--ink);min-height:56px}
.trow .tchk{flex:none;width:48px;display:flex;align-items:center;justify-content:center;
            font-family:var(--serif);font-weight:600;font-size:18px;border-right:1px solid var(--ink)}
.trow .tchk:active{background:var(--ink);color:var(--paper)}
.trow[data-done="1"] .tchk{background:var(--ink);color:var(--paper)}
.trow .tgo{flex:1;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:13px;
           padding:14px 13px;min-width:0}
.trow .tgo:active{background:var(--ink);color:var(--paper)}
.trow .tgo .lead{font-family:var(--serif);font-weight:600;font-size:17px;min-width:20px}
.trow .tgo .ttl{font-family:var(--serif);font-size:17px;line-height:1.25}
.trow .tgo .meta{font-size:12px;margin-top:4px;letter-spacing:.02em}
.trow[data-review="1"] .ttl{font-style:italic}
.trow[data-done="1"] .ttl{text-decoration:line-through}

.sect{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
      margin:24px 0 0;padding-bottom:6px;border-bottom:3px solid var(--ink)}
.grid{display:grid;gap:0;border-left:1px solid var(--ink);border-top:1px solid var(--ink);margin-top:0}
.grid.books{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.grid.chaps{grid-template-columns:repeat(auto-fill,minmax(54px,1fr))}
.cell{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);
      min-height:52px;display:flex;flex-direction:column;justify-content:center;padding:7px 9px}
.cell:active{background:var(--ink);color:var(--paper)}
.cell .cn{font-family:var(--serif);font-size:15px;line-height:1.15}
.cell .cc{font-size:10px;letter-spacing:.06em;margin-top:2px}
.grid.chaps .cell{align-items:center;font-family:var(--serif);font-size:16px;font-variant-numeric:tabular-nums}

/* ── the paginated page ─────────────────────────────────────────────── */
#stage{position:relative;overflow:hidden;height:100%}
#flow{column-fill:auto;padding-top:calc(var(--pad) - 4px);
      font-family:var(--serif);font-size:var(--size);line-height:var(--lead);font-weight:400;
      hyphens:auto;-webkit-hyphens:auto;text-align:left}
#flow p{margin:0 0 .85em;orphans:2;widows:2}
#flow h3{font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
         margin:1.5em 0 .6em;line-height:1.35;break-after:avoid}
#flow h4{font-family:var(--sans);font-size:12px;font-weight:400;font-style:normal;letter-spacing:.03em;
         margin:0 0 .9em;break-after:avoid}
#flow .verse-num,#flow .chapter-num{font-family:var(--sans);font-weight:700;font-size:.56em;
         vertical-align:.5em;line-height:0;margin-right:.12em;letter-spacing:0;font-variant-numeric:tabular-nums}
#flow .chapter-num{font-size:.72em;vertical-align:.34em}
#flow .footnote{display:none}          /* footnote markers add speckle; bodies live on the Notes page */
/* Hanging indent: a poetic line that overruns the measure must not return to
   the verse margin, or the reader cannot tell a wrap from a new line. */
#flow .line{display:block;padding-left:1.15em;text-indent:-1.15em}
/* ESV separates poetic lines with BOTH a block .line and a trailing <br>.
   Left alone that <br> opens an empty line box after every line, so a psalm
   reads double-spaced and burns pages on a panel that turns slowly. The
   block already ends the line; only the redundant break is removed, and
   prose <br> (the footnote block uses them) is untouched. */
#flow .line + br{display:none}
#flow .indent{padding-left:2.45em}
#flow .indent-2{padding-left:3.75em}
#flow .begin-line-group{display:none}
#flow .end-line-group{display:block;height:.5em}   /* stanza break, no blank line */
#flow .divine-name,#flow .small-caps{font-variant-caps:small-caps;letter-spacing:.04em}
#flow em,#flow i{font-style:italic}
#flow .woc{font-style:normal;font-variant-caps:small-caps;letter-spacing:.04em}

.pageno{font-variant-numeric:tabular-nums}

/* ── panels ─────────────────────────────────────────────────────────── */
.panel{border:1px solid var(--ink);padding:15px 16px;margin-top:18px}
.panel h2{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px}
.panel p{margin:0 0 .7em;font-size:14px;line-height:1.5}
.panel p:last-child{margin-bottom:0}
.panel code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;border:1px solid var(--ink);padding:0 4px}
.panel ul,.panel ol{margin:0 0 .7em 1.3em;padding:0}
.panel li{font-size:14px;line-height:1.5;margin-bottom:.25em}
.quote{font-family:var(--serif);font-size:16px;font-style:italic;line-height:1.45;margin:0 0 14px}
textarea{width:100%;min-height:190px;padding:13px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);

   UI voices only: labels annotate in Mono, buttons command in Condensed.

   the reading page stays exactly as it was. */

<body>

<div class="frame">
  <div class="topbar" id="topbar"></div>
  <div class="body" id="body"><div class="inner" id="inner"></div></div>
</div>
<div class="gn-scrim hidden" id="gnscrim"></div>
<nav class="botbar gn hidden" id="botbar" aria-label="Primary"></nav>
<script>
/* carpe-kit v2.0.0 — companion to carpe-kit.css (the bar behaviour). Classic script, no build step.
   Include it with a deferred script tag (src="carpe-kit.js", defer). This
   comment avoids a literal closing script tag so the file can be inlined.
   It does exactly two jobs and nothing else:
     1. measures the rendered .gn height and writes it to --gn-h, so
        clearance never depends on hand-maths (the tasks 4.0.3 lesson);
     2. toggles html.gn-kbd while a text field is focused on a touch
        device, so the bar never sits on top of what you are typing.
   Routing stays in each app. NavKit.setActive(id) is an optional helper. */
(function () {
  'use strict';
  var root = document.documentElement;

  function measure(nav) {
    var h = nav.getBoundingClientRect().height;
    if (h > 0) root.style.setProperty('--gn-h', Math.round(h) + 'px');
  }

  function watchHeight() {
    var nav = document.querySelector('.gn');
    if (!nav) return;
    measure(nav);
    if ('ResizeObserver' in window) {
      new ResizeObserver(function () { measure(nav); }).observe(nav);
    }
  }

  /* Keyboard detection. Two signals, either one is enough:
     - a text-entry element has focus on a coarse pointer (works on
       Android with interactive-widget=resizes-content, where the
       visual viewport does NOT shrink), or
     - the visual viewport is much shorter than the layout viewport (iOS). */
  var TEXTY = /^(text|search|email|url|tel|password|number|date|time|datetime-local)$/;
  var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;

  function isTextEntry(el) {
    if (!el) return false;
    if (el.isContentEditable || el.tagName === 'TEXTAREA') return true;
    return el.tagName === 'INPUT' && TEXTY.test(el.type || 'text');
  }

  function updateKbd() {
    var vv = window.visualViewport;
    var shrunk = vv ? (window.innerHeight - vv.height) > 150 : false;
    var typing = coarse && isTextEntry(document.activeElement);
    root.classList.toggle('gn-kbd', shrunk || typing);
  }

  function watchKeyboard() {
    document.addEventListener('focusin', updateKbd);
    document.addEventListener('focusout', function () { setTimeout(updateKbd, 50); });
    if (window.visualViewport) visualViewport.addEventListener('resize', updateKbd);
  }

  /* Optional: mark the item whose data-gn matches id as current. */
  function setActive(id) {
    var items = document.querySelectorAll('.gn .gn-item[data-gn]');
    for (var i = 0; i < items.length; i++) {
      var on = items[i].getAttribute('data-gn') === id;
      if (on) items[i].setAttribute('aria-current', 'page');
      else items[i].removeAttribute('aria-current');
    }
  }

  function init() { watchHeight(); watchKeyboard(); updateKbd(); }

  window.NavKit = { version: '2.0.0', setActive: setActive, remeasure: watchHeight };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>

<script>
(() => {
'use strict';

/* ── storage ─────────────────────────────────────────────────────────── */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k)    { try { localStorage.removeItem(k); } catch {} },
};
/* When the app is served from its own Worker (the normal case) the Scripture
   proxy is the page's own origin, so there is nothing to configure.  Only a
   copy opened from elsewhere — the Artifact preview, a file:// copy — needs a
   Worker URL typed into Setup. */
const SAME_ORIGIN = (() => {
  try {
    const o = location.origin;
    return /^https?:$/.test(location.protocol) && !/(^|\.)claude\.ai$|(^|\.)anthropic\.com$|usercontent/.test(location.hostname) ? o : '';
  } catch { return ''; }
})();
/* A copy opened away from its own Worker — the Artifact preview, a file://
   copy — still reads, by falling back to the deployed address. This is a
   public URL, not a secret: the ESV key lives only in the Worker. */
const DEPLOYED_WORKER = 'https://narrowkind-scripture.merrickjo.workers.dev';
const cfg = () => {
  const c = Object.assign({ worker: '', key: '', size: 19, lead: 1.62, invert: 0 }, LS.get('nk:cfg', {}));
  if (!c.worker) c.worker = SAME_ORIGIN || DEPLOYED_WORKER;
  return c;
};
const setCfg = (patch) => { const c = Object.assign(cfg(), patch); LS.set('nk:cfg', c); applyCfg(); return c; };
function applyCfg() {
  const c = cfg();
  document.documentElement.style.setProperty('--size', c.size + 'px');
  document.documentElement.style.setProperty('--lead', c.lead);
  document.documentElement.dataset.invert = c.invert ? '1' : '0';
}

const nkey  = (e) => e.planId ? `nk:note:${e.planId}:${e.seq}` : `nk:note:ref:${e.ref}`;
const getNote = (e) => LS.get(nkey(e), null);
const putNote = (e, t) => t.trim() ? LS.set(nkey(e), { text: t, at: Date.now(), ref: e.passage || e.ref }) : LS.del(nkey(e));
const allNotes = () => Object.keys(localStorage).filter(k => k.startsWith('nk:note:'));
/* A note's storage key is nk:note:<planId>:<seq> (plan reading) or
   nk:note:ref:<display ref> (book/chapter browse) -- decode it back into
   routable pieces for the notes list to link to. */
function parseNoteKey(key) {
  const rest = key.slice('nk:note:'.length);
  const i = rest.indexOf(':');
  if (i === -1) return null;
  const head = rest.slice(0, i), tail = rest.slice(i + 1);
  return head === 'ref' ? { kind: 'ref', ref: tail } : { kind: 'plan', planId: head, seq: +tail };
}
/* Reverse a chapter/book note's display ref (e.g. "Genesis 3", "Jude 1-25")
   back into the r/<code>/<chapter> route, using the same book names it was
   built from -- so this stays correct even though ESV's own display can
   cosmetically differ (e.g. "Psalm" vs "Psalms"). Returns null only if the
   ref can't be matched (shouldn't happen for notes this app wrote). */
function noteHref(parsed, refText) {
  if (parsed.kind === 'plan') return `note/p/${parsed.planId}/${parsed.seq}`;
  for (const b of BY.values()) {
    if (b.single) { if (refText === `${b.name} 1-${b.verses[0]}`) return `note/r/${b.code}/1`; }
    else if (refText.startsWith(b.name + ' ')) {
      const rest = refText.slice(b.name.length + 1);
      if (/^\d+$/.test(rest)) return `note/r/${b.code}/${rest}`;
    }
  }
  return null;
}

/* Reading progress: a plain done/not-done flag per plan entry. Only plan
   entries have a natural notion of "done" (a book/chapter browse has no
   fixed slot to mark against), so this is keyed like notes are. */
const dkey    = (e) => `nk:done:${e.planId}:${e.seq}`;
const isDone  = (e) => e.planId ? !!LS.get(dkey(e), false) : false;
const setDone = (e, v) => v ? LS.set(dkey(e), true) : LS.del(dkey(e));
const toggleDone = (e) => setDone(e, !isDone(e));

const CACHE_MAX = 220;
const cacheGet = (r) => LS.get('nk:psg:' + r, null);
function cachePut(r, d) {
  const i = LS.get('nk:psgidx', []);
  if (!i.includes(r)) i.push(r);
  while (i.length > CACHE_MAX) LS.del('nk:psg:' + i.shift());
  LS.set('nk:psgidx', i); LS.set('nk:psg:' + r, d);
}

/* ── data ────────────────────────────────────────────────────────────── */
let PLAN = null, BOOKS = null, BY = new Map();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
/* Minimal Markdown -> HTML for the notes preview: bold, italic, bullet and
   numbered lists, paragraphs. Deliberately small -- a preview of what you
   typed, not a general renderer (no headings/links/nesting). Escapes first,
   so this is safe to inject as innerHTML. */
function mdToHtml(srcText) {
  const lines = esc(srcText || '').replace(/\r\n/g, '\n').split('\n');
  let html = '', para = [], list = null;
  const flushPara = () => { if (para.length) { html += `<p>${para.join(' ')}</p>`; para = []; } };
  const flushList = () => { if (list) { html += `<${list.type}>${list.items.map(i => `<li>${i}</li>`).join('')}</${list.type}>`; list = null; } };
  const inline = (t) => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
  for (const raw of lines) {
    const line = raw.trim();
    const bullet = line.match(/^[-*]\s+(.*)/);
    const numbered = line.match(/^\d+[.)]\s+(.*)/);
    if (bullet) { flushPara(); if (!list || list.type !== 'ul') { flushList(); list = { type: 'ul', items: [] }; } list.items.push(inline(bullet[1])); }
    else if (numbered) { flushPara(); if (!list || list.type !== 'ol') { flushList(); list = { type: 'ol', items: [] }; } list.items.push(inline(numbered[1])); }
    else if (!line) { flushList(); flushPara(); }
    else { flushList(); para.push(inline(line)); }
  }
  flushList(); flushPara();
  return html || '<p>Nothing written yet.</p>';
}
const topbar = $('topbar'), bodyEl = $('body'), inner = $('inner'), botbar = $('botbar');

async function boot() {
  applyCfg();
  const [p, b] = await Promise.all([fetch('plan.json').then(r => r.json()), fetch('books.json').then(r => r.json())]);
  PLAN = p; BOOKS = b;
  for (const r of b) BY.set(r[0], { code: r[0], name: r[1], short: r[2], group: r[3], chapters: r[4], single: !!r[5], verses: r[6] });
  for (const pl of PLAN.plans) pl.bySeq = new Map(pl.entries.map(e => [e.seq, e]));
  addEventListener('hashchange', route);
  addEventListener('keydown', onKey);
  route();
}

/* Navigating to the hash you're already on (e.g. "Done" from the reading
   options sheet, which never changed the hash to get there) fires no
   hashchange event, so the app would just sit on the current page. Route
   explicitly in that case instead of relying on the event. */
function go(href) {
  const h = '#' + href;
  if (location.hash === h) route(); else location.hash = h;
}

/* ── chrome helpers ──────────────────────────────────────────────────── */
function chrome({ title, back, tabs, bottom }) {
  topbar.innerHTML =
    (back ? `<button class="chip" data-go="${esc(back.href)}">${esc(back.label)}</button>` : '') +
    `<span class="t">${esc(title)}</span>`;
  /* One floating bar at the bottom: the reader's page controls when given,
     otherwise the section tabs. .gn-clear makes .body reserve its height so
     no row (and no paginated page) ever sits underneath it. */
  const barHtml = bottom || (tabs ? ['plan|Plan', 'read|Read', 'setup|Set'].map(t => {
      const [id, lbl] = t.split('|');
      return `<button class="gn-item" data-go="${id}"${tabs === id ? ' aria-current="page"' : ''}>${lbl}</button>`;
    }).join('') : '');
  botbar.innerHTML = barHtml;
  botbar.setAttribute('aria-label', bottom ? 'Reader' : 'Sections');
  botbar.querySelectorAll('button').forEach(b => b.classList.add('gn-item'));
  botbar.classList.toggle('hidden', !barHtml);
  $('gnscrim').classList.toggle('hidden', !barHtml);
  bodyEl.classList.toggle('gn-clear', !!barHtml);
  topbar.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  botbar.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
}
function page(html, { scroll = true } = {}) {
  bodyEl.classList.toggle('nopad', !scroll);
  bodyEl.innerHTML = scroll ? `<div class="inner">${html}</div>` : html;
  bodyEl.scrollTop = 0;
  bodyEl.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  // Done-checkboxes toggle in place — no re-route, no full-page e-ink flash —
  // so ticking one off a long week list doesn't cost a refresh per tap.
  bodyEl.querySelectorAll('[data-tgl]').forEach(b => b.onclick = (ev) => {
    ev.preventDefault();
    const [planId, seqStr] = b.dataset.tgl.split('|');
    const e = { planId, seq: +seqStr };
    toggleDone(e);
    const done = isDone(e);
    const trow = b.closest('.trow');
    if (trow) trow.dataset.done = done ? '1' : '0';
    b.textContent = done ? '✓' : '';
    b.setAttribute('aria-pressed', String(done));
  });
}

/* ── router ──────────────────────────────────────────────────────────── */
function route() {
  const seg = decodeURIComponent(location.hash.slice(1) || 'plan').split('/');
  switch (seg[0]) {
    case 'setup': return viewSetup();
    case 'read':  return seg[1] ? viewChapters(seg[1]) : viewBooks();
    case 'r':     return viewReader({ kind: 'chapter', code: seg[1], ch: +seg[2] });
    case 'p':     return viewReader({ kind: 'plan', planId: seg[1], seq: +seg[2] });
    case 'note':  return viewNote(seg.slice(1));
    case 'notes': return viewNotesList();
    case 'plan':
    default:
      if (seg[1] && seg[2]) return viewMovement(seg[1], seg[2]);
      if (seg[1]) return viewMovements(seg[1]);
      return viewPlans();
  }
}

/* ── plan home ───────────────────────────────────────────────────────── */
function viewPlans() {
  chrome({ title: 'Narrowkind', tabs: 'plan' });
  page(PLAN.plans.map(pl => {
    const pos = LS.get('nk:pos:' + pl.id, null);
    const here = pos ? pl.bySeq.get(pos) : null;
    const readings = pl.entries.filter(e => e.type === 'reading').length;
    const done = pl.entries.filter(e => isDone({ planId: pl.id, seq: e.seq })).length;
    return `<button class="row" data-go="plan/${pl.id}">
      <span class="lead">${pl.id.toUpperCase()}</span>
      <span><span class="ttl">${esc(pl.name)}</span>
        <div class="meta">${pl.movements.length} movements · ${readings.toLocaleString()} readings${done ? ` · ${done.toLocaleString()} done` : ''}</div>
        ${here ? `<div class="meta"><b>Last open — ${esc(here.passage)}</b></div>` : ''}</span>
      <span class="tail">${here ? 'Resume' : 'Begin'}</span>
    </button>`;
  }).join('').replace(/^/, '<div class="rows">') + '</div>' +
  `<div class="panel"><h2>Why this reads the way it does</h2>
    <p>Passages are grouped by movement, not by date. Where you stopped is a bookmark — there is nothing here keeping a streak.</p>
    <p>Reading units are whole paragraphs, merged and never split.</p></div>`);
}

/* ── movements ───────────────────────────────────────────────────────── */
function viewMovements(planId) {
  const pl = PLAN.plans.find(p => p.id === planId);
  if (!pl) return viewPlans();
  const pos = LS.get('nk:pos:' + pl.id, null);
  chrome({ title: pl.name, back: { href: 'plan', label: 'Plans' }, tabs: 'plan' });
  page('<div class="rows">' + pl.movements.map(m => {
    const es = pl.entries.filter(e => e.movement === m.id);
    if (!es.length) return '';
    const here = pos && es.some(e => e.seq === pos);
    const readingEs = es.filter(e => e.type === 'reading');
    const doneCount = readingEs.filter(e => isDone({ planId: pl.id, seq: e.seq })).length;
    const tailLines = [`${readingEs.length} reading${readingEs.length === 1 ? '' : 's'}`];
    if (doneCount) tailLines.push(`${doneCount} done`);
    if (here) tailLines.push('HERE');
    return `<button class="row" data-go="plan/${pl.id}/${m.id}">
      <span class="lead">${m.id > 6 ? '—' : m.id}</span>
      <span><span class="ttl">${esc(m.title)}</span>
        <div class="meta">${esc(m.strands.join(' · '))}</div></span>
      <span class="tail">${tailLines.join('<br>')}</span>
    </button>`;
  }).join('') + '</div>');
}

/* ── one movement ────────────────────────────────────────────────────── */
function viewMovement(planId, movId) {
  const pl = PLAN.plans.find(p => p.id === planId);
  const m = pl && pl.movements.find(x => String(x.id) === String(movId));
  if (!m) return viewPlans();
  const pos = LS.get('nk:pos:' + pl.id, null);
  const es = pl.entries.filter(e => e.movement === m.id);
  chrome({ title: m.title, back: { href: 'plan/' + pl.id, label: pl.id.toUpperCase() }, tabs: 'plan' });

  const weeks = new Map();
  for (const e of es) { const w = e.week ?? 0; (weeks.get(w) || weeks.set(w, []).get(w)).push(e); }
  page((m.note ? `<p class="quote">${esc(m.note)}</p>` : '') +
    [...weeks.entries()].map(([w, list]) => `
      <div class="sect">Week ${w}</div>
      <div class="rows" style="border-top:none;margin-top:0">
      ${list.map(e => { const done = isDone({ planId: pl.id, seq: e.seq });
        return `<div class="trow" data-review="${e.type === 'review' ? 1 : 0}" data-done="${done ? 1 : 0}">
        <button class="tchk" data-tgl="${pl.id}|${e.seq}" aria-pressed="${done}" aria-label="${done ? 'Mark not done' : 'Mark done'}">${done ? '✓' : ''}</button>
        <button class="tgo" data-go="p/${pl.id}/${e.seq}">
          <span class="lead">${getNote({ planId: pl.id, seq: e.seq, ref: e.ref }) ? '✒' : ''}${e.seq === pos ? '▮' : ''}</span>
          <span><span class="ttl">${esc(e.passage)}</span>
            <div class="meta">${esc(e.strand || e.book || 'review')}</div></span>
        </button></div>`; }).join('')}
      </div>`).join(''));
}

/* ── books & chapters ────────────────────────────────────────────────── */
function viewBooks() {
  chrome({ title: 'Whole Bible', tabs: 'read' });
  const groups = [];
  let cur = null;
  for (const r of BOOKS) { const b = BY.get(r[0]); if (b.group !== cur) { cur = b.group; groups.push({ name: cur, list: [] }); } groups[groups.length - 1].list.push(b); }
  const last = LS.get('nk:lastchapter', null);
  page((last ? `<button class="row" data-go="r/${last.code}/${last.ch}" style="border-top:1px solid var(--ink)">
      <span class="lead">▮</span><span><span class="ttl">${esc(BY.get(last.code).name)} ${last.ch}</span>
      <div class="meta">Where you were last</div></span><span class="tail">Open</span></button>` : '') +
    groups.map(g => `<div class="sect">${esc(g.name)}</div>
      <div class="grid books">${g.list.map(b => `<button class="cell" data-go="read/${b.code}">
        <span class="cn">${esc(b.name)}</span>
        <span class="cc">${b.single ? b.verses[0] + ' v' : b.chapters + ' ch'}</span></button>`).join('')}</div>`).join(''));
}
function viewChapters(code) {
  const b = BY.get(code);
  if (!b) return viewBooks();
  if (b.single) return location.replace('#r/' + code + '/1');
  chrome({ title: b.name, back: { href: 'read', label: 'Books' }, tabs: 'read' });
  page(`<div class="sect">${esc(b.group)} · ${b.chapters} chapters</div>
    <div class="grid chaps">${Array.from({ length: b.chapters }, (_, i) =>
      `<button class="cell" data-go="r/${code}/${i + 1}">${i + 1}</button>`).join('')}</div>`);
}

/* ── ESV over the Worker ─────────────────────────────────────────────── */
const ready = () => !!cfg().worker;
async function fetchPassage(ref) {
  const hit = cacheGet(ref);
  if (hit) return hit;
  const c = cfg(), base = c.worker.replace(/\/+$/, '');
  const res = await fetch(`${base}/passage?q=${encodeURIComponent(ref)}`, { headers: c.key ? { 'X-App-Key': c.key } : {} });
  const d = await res.json().catch(() => ({ error: 'The Worker sent something that is not JSON.' }));
  if (!res.ok) throw new Error(d.error === 'Reference not found' ? `The ESV API does not recognise “${ref}”.` : (d.error || 'Worker error ' + res.status));
  cachePut(ref, d);
  markCachedForever(ref);
  return d;
}
const prefetch = (ref) => { if (ref && !cacheGet(ref)) fetchPassage(ref).catch(() => {}); };

/* ── whole-Bible offline download ─────────────────────────────────────
   sw.js already keeps every fetched passage in Cache Storage forever (a
   translation never changes, so cache-first with no expiry is correct,
   not just convenient). What was missing was a way to *ask* for
   everything, rather than only ever having what you happen to have read.
   This walks the whole canon — every chapter, plus every plan reading,
   since a plan ref is sometimes segmented differently from a whole
   chapter — through the same fetchPassage() call, so anything it
   touches becomes as permanent as anything read by hand. Progress
   survives reloads; a dropped connection just pauses and resumes. */
const BULK_DONE_KEY = 'nk:bulkdone';
const BULK = { running: false, refs: null, doneSet: null, note: '' };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function bulkDoneSet() {
  if (!BULK.doneSet) BULK.doneSet = new Set(LS.get(BULK_DONE_KEY, []));
  return BULK.doneSet;
}
let bulkDirty = 0;
function bulkPersist(force) {
  bulkDirty++;
  if (force || bulkDirty >= 5) { LS.set(BULK_DONE_KEY, Array.from(bulkDoneSet())); bulkDirty = 0; }
}
function markCachedForever(ref) {
  const done = bulkDoneSet();
  if (!done.has(ref)) { done.add(ref); bulkPersist(false); }
}
function bulkAllRefs() {
  if (BULK.refs) return BULK.refs;
  const refs = [], seen = new Set();
  const add = (r) => { if (r && !seen.has(r)) { seen.add(r); refs.push(r); } };
  for (const b of BY.values()) {
    if (b.single) add(`${b.name} 1-${b.verses[0]}`);
    else for (let ch = 1; ch <= b.chapters; ch++) add(`${b.name} ${ch}`);
  }
  for (const pl of PLAN.plans) for (const e of pl.entries) if (e.type === 'reading') add(e.ref);
  BULK.refs = refs;
  return refs;
}
function waitOnline() { return new Promise((r) => { const h = () => { removeEventListener('online', h); r(); }; addEventListener('online', h); }); }
let bulkAbort = false;
async function runBulk() {
  if (BULK.running) return;
  BULK.running = true; bulkAbort = false; BULK.note = '';
  renderBulkPanel();
  const refs = bulkAllRefs(), done = bulkDoneSet();
  for (const ref of refs) {
    if (bulkAbort) break;
    if (done.has(ref)) continue;
    if (!navigator.onLine) { BULK.note = 'Waiting for a connection…'; renderBulkPanel(); await waitOnline(); if (bulkAbort) break; }
    let ok = false;
    for (let attempt = 0; attempt < 3 && !ok && !bulkAbort; attempt++) {
      try { await fetchPassage(ref); ok = true; }
      catch { await sleep(attempt === 0 ? 1500 : 4000); }
    }
    BULK.note = ok ? '' : `Skipped ${ref} for now — will retry next run.`;
    renderBulkPanel();
    await sleep(180);
  }
  bulkPersist(true);
  BULK.running = false;
  BULK.note = bulkAbort ? 'Paused.' : (bulkDoneSet().size >= bulkAllRefs().length ? 'Every passage is on this device — the whole Bible is offline.' : 'Stopped for now — open Setup again to keep going.');
  renderBulkPanel();
}
function pauseBulk() { bulkAbort = true; }
function bulkPanelHtml() {
  const total = bulkAllRefs().length, done = bulkDoneSet().size, complete = done >= total;
  const pct = total ? Math.round((done / total) * 100) : 0;
  return `<p>${done.toLocaleString()} / ${total.toLocaleString()} passages held forever on this device (${pct}%)${complete ? ' — the whole Bible is offline.' : '.'}</p>
    ${BULK.note ? `<p class="meta">${esc(BULK.note)}</p>` : ''}
    <div class="btnrow">${complete ? '' :
      `<button class="btn fill" id="bulk-go">${BULK.running ? 'Pause' : (done ? 'Resume download' : 'Download the whole Bible')}</button>`}</div>`;
}
function bindBulkPanel() {
  const go = $('bulk-go');
  if (go) go.onclick = () => { BULK.running ? pauseBulk() : runBulk(); };
}
function renderBulkPanel() {
  const el = $('bulk-panel');
  if (!el) return;
  el.innerHTML = bulkPanelHtml();
  bindBulkPanel();
}

/* ── the reader: paginated, never scrolls ────────────────────────────── */
let PG = { page: 0, pages: 1, ctx: null };

function neighbours(ctx) {
  if (ctx.kind === 'plan') {
    const pl = PLAN.plans.find(p => p.id === ctx.planId);
    const prev = pl.bySeq.get(ctx.seq - 1), next = pl.bySeq.get(ctx.seq + 1);
    return { prev: prev && `p/${ctx.planId}/${prev.seq}`, next: next && `p/${ctx.planId}/${next.seq}`,
             prevRef: prev && prev.ref, nextRef: next && next.ref };
  }
  const b = BY.get(ctx.code);
  return { prev: ctx.ch > 1 ? `r/${ctx.code}/${ctx.ch - 1}` : null,
           next: ctx.ch < b.chapters ? `r/${ctx.code}/${ctx.ch + 1}` : null,
           nextRef: ctx.ch < b.chapters ? `${b.name} ${ctx.ch + 1}` : null };
}

function viewReader(ctx) {
  let title, backTo, backLbl, ref, entry, isReview = false, sub = '';
  if (ctx.kind === 'plan') {
    const pl = PLAN.plans.find(p => p.id === ctx.planId);
    const e = pl && pl.bySeq.get(ctx.seq);
    if (!e) return viewPlans();
    LS.set('nk:pos:' + pl.id, ctx.seq);
    const m = pl.movements.find(x => x.id === e.movement);
    const readings = pl.entries.filter(x => x.type === 'reading');
    const nth = readings.indexOf(e) + 1;
    title = e.passage; ref = e.ref; isReview = e.type === 'review';
    backTo = `plan/${ctx.planId}/${e.movement}`; backLbl = 'Back';
    sub = `${m ? m.title : ''} · week ${e.week}${nth > 0 ? ` · ${nth.toLocaleString()} of ${readings.length.toLocaleString()}` : ''}`;
    entry = { planId: ctx.planId, seq: ctx.seq, ref: e.ref, passage: e.passage, day: e.day, notion: e.notion, movement: e.movement, book: e.book };
    ctx.entry = e;
  } else {
    const b = BY.get(ctx.code);
    if (!b || !ctx.ch) return viewBooks();
    LS.set('nk:lastchapter', { code: ctx.code, ch: ctx.ch });
    title = b.single ? b.name : `${b.name} ${ctx.ch}`;
    ref = b.single ? `${b.name} 1-${b.verses[0]}` : `${b.name} ${ctx.ch}`;
    backTo = b.single ? 'read' : 'read/' + ctx.code; backLbl = 'Back';
    sub = b.single ? `${b.verses[0]} verses` : `chapter ${ctx.ch} of ${b.chapters}`;
    entry = { ref, passage: title };
  }
  PG.ctx = Object.assign({}, ctx, { ref, entry, title });

  const nb = neighbours(ctx);
  chrome({
    title,
    back: { href: backTo, label: backLbl },
    bottom: `<button id="b-prev">‹ Prev</button>
             <button class="wide" id="b-pos"><span class="pageno" id="pgno">—</span></button>
             <button id="b-note">Note</button>
             <button id="b-next">Next ›</button>`,
  });

  if (isReview) return renderReview(ctx, entry, sub);
  if (!ready()) {
    page(`<div class="panel"><h2>Connect the Worker</h2>
      <p>Scripture is fetched from the ESV API through your Cloudflare Worker — it is never generated here.</p>
      <p>Add the Worker address under <b>Set</b>, and this device will remember it.</p>
      <div class="btnrow"><button class="btn fill" data-go="setup">Open setup</button></div></div>`);
    wireBottom(nb, false);
    return;
  }

  page(`<div id="stage"><div id="flow"><p style="font-family:var(--sans);font-size:13px">Loading ${esc(title)}…</p></div>
        <button class="tapzone l" id="tz-l" aria-label="Previous page"></button>
        <button class="tapzone r" id="tz-r" aria-label="Next page"></button></div>`, { scroll: false });
  wireBottom(nb, true);

  fetchPassage(ref).then(d => {
    const flow = $('flow');
    if (!flow || PG.ctx.ref !== ref) return;
    // No display heading here — the top bar already carries the reference,
    // and on a phone-shaped panel a second one costs a third of page one.
    flow.innerHTML = `<div class="kicker" style="margin-bottom:1.1em">${esc(sub)}</div>
      ${d.html}
      <div class="cite">${esc(d.copyright)}</div>`;
    const canon = d.passage && d.passage.reference;
    if (canon) { const t = topbar.querySelector('.t'); if (t) t.textContent = canon; }
    paginate();
    prefetch(nb.nextRef); prefetch(nb.prevRef);
  }).catch(err => {
    const flow = $('flow');
    if (flow) flow.innerHTML = `<div class="panel" style="margin:0"><h2>Could not load this passage</h2><p>${esc(err.message)}</p></div>`;
    setPageNo(1, 1);
  });
}

function renderReview(ctx, entry, sub) {
  const pl = PLAN.plans.find(p => p.id === ctx.planId);
  const e = ctx.entry;
  const scope = e.book ? pl.entries.filter(x => x.book === e.book && x.type === 'reading')
                       : pl.entries.filter(x => x.movement === e.movement && x.type === 'reading');
  const kept = scope.filter(x => getNote({ planId: pl.id, seq: x.seq, ref: x.ref }));
  page(`<div class="kicker">${esc(sub)}</div><h1>${esc(e.passage)}</h1>
    <div class="panel"><h2>A review day</h2>
      <p>Nothing new to read. This is for going back over ${esc(e.book || 'the movement')} — ${scope.length} readings — and over what you wrote along the way.</p></div>
    ${kept.length ? `<div class="sect">Your notes here — ${kept.length}</div><div class="rows" style="border-top:none;margin-top:0">
      ${kept.map(x => { const n = getNote({ planId: pl.id, seq: x.seq, ref: x.ref });
        return `<button class="row" data-go="p/${pl.id}/${x.seq}"><span class="lead">✒</span>
          <span><span class="ttl">${esc(x.passage)}</span><div class="meta">${esc((n.text || '').slice(0, 90))}</div></span>
          <span class="tail"></span></button>`; }).join('')}</div>`
      : '<div class="panel"><p>No notes saved in this stretch yet.</p></div>'}`);
  wireBottom(neighbours(ctx), false);
}

function wireBottom(nb, paged) {
  const prev = $('b-prev'), next = $('b-next'), pos = $('b-pos'), note = $('b-note');
  if (!prev) return;
  note.onclick = () => go('note/' + (PG.ctx.kind === 'plan' ? `p/${PG.ctx.planId}/${PG.ctx.seq}` : `r/${PG.ctx.code}/${PG.ctx.ch}`));
  pos.onclick = openOptions;
  prev.onclick = () => paged && PG.page > 0 ? turn(-1) : (nb.prev ? go(nb.prev) : null);
  next.onclick = () => paged && PG.page < PG.pages - 1 ? turn(1) : (nb.next ? go(nb.next) : null);
  if (!nb.prev && !paged) prev.disabled = true;
  if (!nb.next && !paged) next.disabled = true;
  const l = $('tz-l'), r = $('tz-r');
  if (l) l.onclick = prev.onclick;
  if (r) r.onclick = next.onclick;
  if (!paged) setPageNo(0, 0);
}

function setPageNo(p, n) {
  const el = $('pgno');
  if (el) el.textContent = n > 1 ? `${p + 1} / ${n}` : (n === 0 ? 'Options' : 'Options');
}

function paginate() {
  const stage = $('stage'), flow = $('flow');
  if (!stage || !flow) return;
  // Column pitch must equal exactly one stage width, or the next column
  // bleeds into view at the right edge. With border-box sizing that means
  // width = W, side padding = p, column width = W - 2p, column gap = 2p:
  //   pitch = (W - 2p) + 2p = W
  const W = stage.clientWidth;
  const p = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--pad')) || 20;
  flow.style.width = W + 'px';
  flow.style.paddingLeft = p + 'px';
  flow.style.paddingRight = p + 'px';
  flow.style.columnWidth = (W - p * 2) + 'px';
  flow.style.columnGap = (p * 2) + 'px';
  flow.style.height = stage.clientHeight + 'px';
  PG.pages = Math.max(1, Math.round(flow.scrollWidth / W));
  PG.page = 0;
  applyPage();
}
function applyPage() {
  const stage = $('stage'), flow = $('flow');
  if (!stage || !flow) return;
  flow.style.transform = `translateX(${-PG.page * stage.clientWidth}px)`;
  setPageNo(PG.page, PG.pages);
}
function turn(d) {
  const n = PG.page + d;
  if (n < 0 || n >= PG.pages) return;
  PG.page = n; applyPage();
}
function onKey(ev) {
  if (/^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
  if (ev.key === 'ArrowRight' || ev.key === ' ' || ev.key === 'PageDown') { ev.preventDefault(); $('b-next') && $('b-next').click(); }
  if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') { ev.preventDefault(); $('b-prev') && $('b-prev').click(); }
}
addEventListener('resize', () => { if ($('flow') && $('flow').children.length > 1) paginate(); });

/* ── options sheet ───────────────────────────────────────────────────── */
function openOptions() {
  const c = cfg();
  const ctx = PG.ctx;
  const done = ctx.kind === 'plan' && isDone({ planId: ctx.planId, seq: ctx.seq });
  chrome({ title: 'Reading options', back: { href: ctx.kind === 'plan' ? `p/${ctx.planId}/${ctx.seq}` : `r/${ctx.code}/${ctx.ch}`, label: 'Done' } });
  page(`${ctx.kind === 'plan' ? `<div class="sect">Progress</div>
    <div class="btnrow" style="margin-top:14px">
      <button class="btn${done ? ' fill' : ''}" id="o-done">${done ? '✓ Marked done — tap to undo' : 'Mark this reading done'}</button>
    </div>` : ''}
    <div class="sect">Type</div>
    <div class="btnrow" style="margin-top:14px">
      <div class="stepper"><button id="s-dn">A−</button><span class="val" id="s-val">${c.size}px</span><button id="s-up">A+</button></div>
      <div class="stepper"><button id="l-dn">↕−</button><span class="val" id="l-val">${c.lead.toFixed(2)}</span><button id="l-up">↕+</button></div>
    </div>
    <div class="sect">Panel</div>
    <div class="btnrow" style="margin-top:14px">
      <button class="btn${c.invert ? ' fill' : ''}" id="o-inv">${c.invert ? 'White on black' : 'Black on white'}</button>
      <button class="btn" id="o-ref">Clear ghosting</button>
    </div>
    <div class="panel"><h2>About clearing</h2>
      <p>E-ink leaves faint traces of what was on screen before. <b>Clear ghosting</b> flashes the page black and back once, which resets the panel.</p></div>
    <div class="panel"><h2>Offline</h2><p>${bulkDoneSet().size.toLocaleString()} passages held forever on this device${BULK.running ? ' — downloading the rest now.' : '.'} Turning to the next reading fetches the one after it, so a page turn rarely waits.</p></div>`);

  const c2 = () => cfg();
  $('s-up').onclick = () => { const v = Math.min(30, c2().size + 1); setCfg({ size: v }); $('s-val').textContent = v + 'px'; };
  $('s-dn').onclick = () => { const v = Math.max(14, c2().size - 1); setCfg({ size: v }); $('s-val').textContent = v + 'px'; };
  $('l-up').onclick = () => { const v = Math.min(2.2, +(c2().lead + .06).toFixed(2)); setCfg({ lead: v }); $('l-val').textContent = v.toFixed(2); };
  $('l-dn').onclick = () => { const v = Math.max(1.2, +(c2().lead - .06).toFixed(2)); setCfg({ lead: v }); $('l-val').textContent = v.toFixed(2); };
  $('o-inv').onclick = () => { const v = c2().invert ? 0 : 1; setCfg({ invert: v }); openOptions(); };
  $('o-ref').onclick = flashRefresh;
  const doneBtn = $('o-done');
  if (doneBtn) doneBtn.onclick = () => { toggleDone({ planId: ctx.planId, seq: ctx.seq }); openOptions(); };
}
function flashRefresh() {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;background:#000;z-index:999';
  document.body.appendChild(d);
  setTimeout(() => { d.style.background = '#fff'; setTimeout(() => d.remove(), 120); }, 120);
}

/* ── notes list ─────────────────────────────────────────────────────── */
function viewNotesList() {
  chrome({ title: 'Notes', back: { href: 'setup', label: 'Setup' } });
  const rows = allNotes()
    .map(k => ({ note: LS.get(k, null), parsed: parseNoteKey(k) }))
    .filter(x => x.note && x.parsed)
    .sort((a, b) => (b.note.at || 0) - (a.note.at || 0));
  if (!rows.length) {
    page('<div class="panel"><p>No notes yet — save one from any passage you\'re reading.</p></div>');
    return;
  }
  page(`<div class="rows">${rows.map(({ note, parsed }) => {
    const href = noteHref(parsed, note.ref);
    const clean = (note.text || '').replace(/\s+/g, ' ').trim();
    const snippet = esc(clean.slice(0, 90)) + (clean.length > 90 ? '…' : '');
    const inner = `<span class="lead">✒</span>
      <span><span class="ttl">${esc(note.ref || 'Untitled')}</span>
        <div class="meta">${snippet || '<i>Empty note.</i>'}</div>
        <div class="meta">${new Date(note.at).toLocaleDateString()}</div></span>
      <span class="tail"></span>`;
    return href ? `<button class="row" data-go="${href}">${inner}</button>` : `<div class="row">${inner}</div>`;
  }).join('')}</div>`);
}

/* ── note page ───────────────────────────────────────────────────────── */
function viewNote(seg) {
  let entry, backHref, title;
  if (seg[0] === 'p') {
    const pl = PLAN.plans.find(p => p.id === seg[1]); const e = pl && pl.bySeq.get(+seg[2]);
    if (!e) return viewPlans();
    entry = { planId: seg[1], seq: +seg[2], ref: e.ref, passage: e.passage, day: e.day, notion: e.notion };
    backHref = `p/${seg[1]}/${seg[2]}`; title = e.passage;
  } else {
    const b = BY.get(seg[1]); if (!b) return viewBooks();
    title = b.single ? b.name : `${b.name} ${seg[2]}`;
    entry = { ref: b.single ? `${b.name} 1-${b.verses[0]}` : title, passage: title };
    backHref = `r/${seg[1]}/${seg[2]}`;
  }
  const saved = getNote(entry);
  const canPush = !!(entry.planId && entry.day != null && entry.notion);
  chrome({ title: 'Note · ' + title, back: { href: backHref, label: 'Back' } });
  page(`<p class="quote">Read it again. What changed in what you noticed?</p>
    <div class="btnrow" id="n-toolbar" style="margin-top:0">
      <button class="btn" id="n-bold" aria-label="Bold"><b>B</b></button>
      <button class="btn" id="n-ital" aria-label="Italic"><i>I</i></button>
    </div>
    <textarea id="ta" placeholder="Whatever you saw this time.">${esc(saved ? saved.text : '')}</textarea>
    <div class="panel hidden" id="n-preview"></div>
    <div class="btnrow">
      <button class="btn fill" id="n-save">Save</button>
      <button class="btn" id="n-prev">Preview</button>
      ${canPush ? '<button class="btn" id="n-push">To Notion</button>' : ''}
      <span class="said" id="n-said">${saved ? 'Saved ' + new Date(saved.at).toLocaleDateString() : 'Kept on this device.'}</span>
    </div>`);
  const ta = $('ta'), said = $('n-said'), prevBtn = $('n-prev'), prevPane = $('n-preview'), toolbar = $('n-toolbar');
  let previewing = false;
  prevBtn.onclick = () => {
    previewing = !previewing;
    if (previewing) prevPane.innerHTML = mdToHtml(ta.value);
    ta.classList.toggle('hidden', previewing);
    toolbar.classList.toggle('hidden', previewing);
    prevPane.classList.toggle('hidden', !previewing);
    prevBtn.textContent = previewing ? 'Edit' : 'Preview';
    prevBtn.classList.toggle('fill', previewing);
  };
  // Wrap the current selection in a Markdown marker (or, with nothing
  // selected, drop the cursor between an empty pair) and keep focus in the
  // textarea so the next keystroke lands right where it should.
  const wrap = (marker) => {
    const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
    ta.value = v.slice(0, s) + marker + v.slice(s, e) + marker + v.slice(e);
    ta.focus();
    ta.setSelectionRange(s + marker.length, e + marker.length);
  };
  $('n-bold').onclick = () => wrap('**');
  $('n-ital').onclick = () => wrap('*');
  $('n-save').onclick = () => { putNote(entry, ta.value); said.textContent = ta.value.trim() ? 'Saved.' : 'Cleared.'; };
  const push = $('n-push');
  if (push) push.onclick = async () => {
    const t = ta.value.trim(); if (!t) { said.textContent = 'Nothing to send yet.'; return; }
    putNote(entry, t); said.textContent = 'Sending…';
    try {
      const c = cfg();
      const r = await fetch(c.worker.replace(/\/+$/, '') + '/note', {
        method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, c.key ? { 'X-App-Key': c.key } : {}),
        body: JSON.stringify({ plan: entry.planId, day: entry.day, text: t, passage: entry.passage }) });
      const d = await r.json().catch(() => ({}));
      said.textContent = r.ok ? `Added to day ${entry.day} in Notion.` : 'Notion said: ' + (d.error || r.status);
    } catch { said.textContent = 'Could not reach the Worker.'; }
  };
}

      const r = await fetch(base + '/health', { headers: k ? { 'X-App-Key': k } : {} });
      const d = await r.json();
      said.textContent = !r.ok ? `Replied ${r.status}.`
        : d.esv ? 'Connected.' + (d.notion ? ' Notion too.' : ' No Notion token.') : 'Reached it, but no ESV key is set.';
    } catch { said.textContent = 'Could not reach that address.'; }
  };
  bindBulkPanel();
  $('n-exp').onclick = () => {
    const rows = allNotes().map(k => LS.get(k, null)).filter(Boolean).sort((a, b) => (a.ref || '').localeCompare(b.ref || ''));
    const md = ['# Narrowkind Immersion — notes', '', `${rows.length} notes · ${new Date().toISOString().slice(0, 10)}`, '']
      .concat(rows.flatMap(x => [`## ${x.ref}`, '', x.text, ''])).join('\n');
    navigator.clipboard?.writeText(md).then(() => $('n-esaid').textContent = `${rows.length} copied.`,
                                            () => $('n-esaid').textContent = 'Clipboard unavailable here.');
  };
  $('p-inv').onclick = () => { setCfg({ invert: cfg().invert ? 0 : 1 }); viewSetup(); };
  $('p-ref').onclick = flashRefresh;
  $('sw-upd').onclick = async () => {
    const said = $('sw-said');
    if (!('serviceWorker' in navigator)) { said.textContent = 'Not available in this browser.'; return; }
    said.textContent = 'Checking…';
    try {
      const reg = SWREG || await navigator.serviceWorker.getRegistration();
      if (!reg) { said.textContent = 'No offline copy installed on this device yet.'; return; }
      await reg.update();
      said.textContent = 'Checked. Reloading…';
      setTimeout(() => location.reload(), 500);
    } catch { said.textContent = 'Could not check for updates.'; }
  };
}

boot().catch(e => { inner.innerHTML = `<div class="panel"><h2>Could not load the plan</h2><p>${esc(e.message)}</p></div>`; });
})();
</script>
<script>
/* Offline is the point: this reader is meant to live on an e-ink device that
   is often out of range. The shell and the plan are cached on first visit. */
let SWREG = null;
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  // updateViaCache:'none' stops the browser treating sw.js itself as
  // cacheable — without it, browsers can go up to ~24h between checking
  // whether the registered worker is stale, no matter how often the page
  // is reloaded. Reloading on controllerchange means a fix that did land
  // (via the Setup "Check for updates" button, or the next natural check)
  // shows up immediately instead of on the *next* load after that.
  addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => { SWREG = r; }).catch(() => {}));
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
}
</script>
