  <path d="M256 136 C 312 108, 376 104, 416 108 v264 c -40 -4 -104 0 -160 28"
        fill="none" stroke="#000000" stroke-width="16" stroke-linejoin="miter"/>
  <path d="M136 168 h72 M136 208 h72 M136 248 h72 M304 168 h72 M304 208 h72 M304 248 h72"
        stroke="#000000" stroke-width="10"/>
